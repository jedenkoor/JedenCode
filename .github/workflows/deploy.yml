name: Deploy

# Build once, then upload to Jino with up to 3 attempts, each on a fresh runner
# (see ftp-upload.yml for why). Local fallback: `npm run deploy`.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue deploys instead of cancelling: an interrupted FTP upload can leave
# the server's .ftp-deploy-sync-state.json out of sync with the files.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: .output/public/
          include-hidden-files: true # keep .htaccess
          if-no-files-found: error
          retention-days: 1

  deploy-1:
    needs: build
    uses: ./.github/workflows/ftp-upload.yml
    with:
      attempt: 1
    secrets: inherit

  deploy-2:
    needs: [build, deploy-1]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.deploy-1.outputs.deployed != 'true' }}
    uses: ./.github/workflows/ftp-upload.yml
    with:
      attempt: 2
    secrets: inherit

  deploy-3:
    needs: [build, deploy-2]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.deploy-2.outputs.deployed != 'true' }}
    uses: ./.github/workflows/ftp-upload.yml
    with:
      attempt: 3
    secrets: inherit

  result:
    needs: [build, deploy-1, deploy-2, deploy-3]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check that one attempt deployed
        run: |
          for attempt in 1 2 3; do
            case $attempt in
              1) deployed='${{ needs.deploy-1.outputs.deployed }}' ;;
              2) deployed='${{ needs.deploy-2.outputs.deployed }}' ;;
              3) deployed='${{ needs.deploy-3.outputs.deployed }}' ;;
            esac
            if [ "$deployed" = "true" ]; then
              echo "Deployed on attempt $attempt" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::error::All 3 upload attempts failed. Deploy locally: npm run deploy"
          exit 1
